services:
  # PostgreSQL database
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: fixflow_db
      POSTGRES_USER: fixflow_user
      POSTGRES_PASSWORD: fixflow123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixflow_user -d fixflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot backend
  api:
    build: ./backend
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/fixflow_db
      SPRING_DATASOURCE_USERNAME: fixflow_user
      SPRING_DATASOURCE_PASSWORD: fixflow123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_JWT_SECRET: fixflow-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm
      APP_JWT_EXPIRATION: 86400000

  # Vue.js frontend served via Nginx
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
