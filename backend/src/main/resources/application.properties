# ===================================================================
# FixFlow — Application Configuration
# ===================================================================

# --- Database (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/fixflow_db
spring.datasource.username=fixflow_user
spring.datasource.password=fixflow123

# Let Hibernate auto-create/update the schema from entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Prevent data.sql from running (we use DataSeeder.java instead)
spring.sql.init.mode=never

# --- JWT Settings ---
# Secret must be >=256 bits for HS256. Change this in production!
app.jwt.secret=fixflow-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm
app.jwt.expiration=86400000

# --- Server ---
server.port=8080

# --- Jackson: serialize LocalDateTime as ISO-8601 strings ---
spring.jackson.serialization.write-dates-as-timestamps=false
