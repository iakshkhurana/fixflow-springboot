# Test configuration — uses H2 in-memory database instead of PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create schema fresh for each test run, drop it after
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Don't run data.sql in tests
spring.sql.init.mode=never

# JWT settings must be present for JwtUtil bean to initialize
app.jwt.secret=test-secret-key-that-is-at-least-256-bits-long-for-hs256-testing-purposes
app.jwt.expiration=86400000

spring.jackson.serialization.write-dates-as-timestamps=false
